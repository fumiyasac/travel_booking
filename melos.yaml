name: travel_booking
repository: https://github.com/fumiyasac/travel_booking

packages:
  - travel_booking_mobile

sdkPath: auto

command:
  bootstrap:
    usePubspecOverrides: true

scripts:
  build_runner:
    description: Run build_runner to generate code
    exec: dart run build_runner build --delete-conflicting-outputs
    packageFilters:
      dirExists: lib

  build_runner:watch:
    description: Watch and regenerate code
    exec: dart run build_runner watch --delete-conflicting-outputs
    packageFilters:
      dirExists: lib

  test:
    description: Run all unit tests
    exec: flutter test
    packageFilters:
      dirExists: test

  analyze:
    description: Run static analysis
    exec: flutter analyze
    packageFilters:
      dirExists: lib

  format:
    description: Format source code
    exec: dart format lib/ test/
    packageFilters:
      dirExists: lib

  clean:
    description: Clean build artifacts
    exec: flutter clean
    packageFilters:
      dirExists: lib

  get:
    description: Get dependencies
    exec: flutter pub get
    packageFilters:
      dirExists: lib

  preview:
    description: Widgetbook プレビューをデフォルトデバイスで起動
    exec: flutter run -t lib/preview/main.dart
    packageFilters:
      dirExists: lib/preview

  preview:web:
    description: Widgetbook プレビューを Chrome で起動
    exec: flutter run -t lib/preview/main.dart -d chrome
    packageFilters:
      dirExists: lib/preview

  setup-hooks:
    description: Git pre-commit フックを有効化する（初回セットアップ時に一度だけ実行）
    run: git config core.hooksPath .githooks && chmod +x .githooks/pre-commit && echo "✅ pre-commit フックを有効化しました"
