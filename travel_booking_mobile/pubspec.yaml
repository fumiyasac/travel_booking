name: travel_booking_mobile
description: Travel plan browsing and booking mobile application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State management
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  # Local storage (favorites)
  shared_preferences: ^2.3.0
  # HTTP client (GraphQL via HTTP POST)
  http: ^1.2.0
  # Navigation
  go_router: ^14.6.2
  # UI utilities
  intl: ^0.20.2
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  gap: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: '>=2.4.0 <3.0.0'
  riverpod_generator: ^3.0.0
  custom_lint: ^0.8.1
  riverpod_lint: '>=3.0.0 <3.1.0'
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/graphql/
