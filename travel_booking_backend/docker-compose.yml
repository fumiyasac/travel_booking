services:
  mysql:
    image: mysql:8.0
    container_name: travel_booking_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: travel_booking
      MYSQL_USER: travel_user
      MYSQL_PASSWORD: travel_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 30s
    networks:
      - travel_booking_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: travel_booking_backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://root:password@mysql:3306/travel_booking
      PORT: 4000
      NODE_ENV: development
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - travel_booking_network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  travel_booking_network:
    driver: bridge
